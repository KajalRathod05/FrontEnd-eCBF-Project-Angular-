<div class="customer-container">
  <mat-card class="customer-card">
    <mat-tab-group [(selectedIndex)]="selectedTab" (selectedTabChange)="tabChanged($event)">

      <mat-tab label="Customer">
        <div class="tab-content">
          <!-- <div class="toolbar">
            <button mat-raised-button color="primary" (click)="addCustomer()">
              <mat-icon>add</mat-icon>
              Add Customer
            </button>
          </div> -->

          <div class="table-container">
            <table mat-table [dataSource]="dataSource">

              <ng-container matColumnDef="customerName">
                <th mat-header-cell *matHeaderCellDef>Customer Name</th>
                <td mat-cell *matCellDef="let customer">
                  {{ customer.firstname }} {{ customer.lastname }}
                </td>
              </ng-container>

              <ng-container matColumnDef="loanType">
                <th mat-header-cell *matHeaderCellDef>Loan Type</th>
                <td mat-cell *matCellDef="let customer">
                  {{ customer.loanTypeName }}
                </td>
              </ng-container>

              <ng-container matColumnDef="view">
                <th mat-header-cell *matHeaderCellDef>View</th>
                <td mat-cell *matCellDef="let customer">
                  <button mat-icon-button>
                    <mat-icon>visibility</mat-icon>
                  </button>
                </td>
              </ng-container>

              <ng-container matColumnDef="edit">
                <th mat-header-cell *matHeaderCellDef>Edit</th>
                <td mat-cell *matCellDef="let customer">
                  <button mat-icon-button (click)="selectedTab = 1">
                    <mat-icon>edit</mat-icon>
                  </button>
                </td>
              </ng-container>

              <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef>Status</th>
                <td mat-cell *matCellDef="let customer">
                  {{ customer.approveflag }}
                </td>
              </ng-container>

              <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef>Action</th>
                <td mat-cell *matCellDef="let customer">
                  <button mat-icon-button>
                    <mat-icon>more_vert</mat-icon>
                  </button>
                </td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

            </table>
          </div>

          <mat-paginator
            [pageSize]="5"
            [pageSizeOptions]="[5, 10, 20]">
          </mat-paginator>
        </div>
      </mat-tab>

      <mat-tab label="Add/Edit Customer">
        <app-addeditcustomer></app-addeditcustomer>
      </mat-tab>

      <mat-tab label="Customer Activity Tracker">
        <app-customer-act-tracker></app-customer-act-tracker>
      </mat-tab>

    </mat-tab-group>
  </mat-card>
</div>
